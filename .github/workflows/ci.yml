name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Also re-run Stage 10 (25-60 min)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit and consistency tests
        run: pytest -q
      - name: Re-run Stages 07-09 from the committed rankings and compare
        run: python scripts/reproduce.py --stages 07 08 09
      - name: Re-run Stage 10 and compare (manual runs only)
        if: ${{ inputs.full }}
        run: python scripts/reproduce.py --stages 10
